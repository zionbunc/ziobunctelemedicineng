<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Symptom Checker - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1a2b4c; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 20px; }
        textarea { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; height: 100px; margin-bottom: 15px; resize: vertical; }
        button { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result { display: none; margin-top: 20px; padding: 20px; background: #e7f3ff; border-radius: 8px; text-align: left; }
        #result h3 { color: #007bff; margin-bottom: 10px; }
        .back-link { display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
        .loader { display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Symptom Checker</h1>
        <p>Describe your symptoms below, and our AI will suggest which type of doctor you should see.</p>
        
        <textarea id="symptomsInput" placeholder="e.g., I have a headache, fever, and sore throat..."></textarea>
        <button id="checkBtn" onclick="checkSymptoms()">Check Symptoms</button>
        <div id="loader" class="loader">🔄 AI is analyzing your symptoms...</div>
        
        <div id="result">
            <h3>🩺 AI Recommendation</h3>
            <p id="resultText">Loading...</p>
        </div>
        
        <a href="https://ziobunctelemedicineng.vercel.app" class="back-link">← Back to Home</a>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6KreUE8jXcc6uldK6s_YDBFfJmaIHJ0i10dBwaargo9Mg';

        async function checkSymptoms() {
            const input = document.getElementById('symptomsInput').value;
            if (!input.trim()) {
                alert("Please describe your symptoms first.");
                return;
            }

            document.getElementById('checkBtn').disabled = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `A patient has these symptoms: "${input}". Based on these symptoms, recommend ONE medical specialty (e.g., General, Pediatrics, Dermatology, Cardiology, Neurology) and give a 1-sentence explanation. Format: "Specialty: [Name]" and "Reason: [Sentence]"`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                
                document.getElementById('resultText').innerText = text;
                document.getElementById('result').style.display = 'block';
            } catch (error) {
                document.getElementById('resultText').innerText = "Error: Could not reach AI. Please try again.";
                document.getElementById('result').style.display = 'block';
            } finally {
                document.getElementById('checkBtn').disabled = false;
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
