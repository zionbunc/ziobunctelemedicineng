<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Symptom Checker - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #ffffff; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        textarea { width: 100%; padding: 15px; border: 1px solid #444; border-radius: 8px; font-size: 16px; height: 100px; margin-bottom: 15px; resize: vertical; background: #2a2a2a; color: #e0e0e0; }
        button { background: #2563eb; color: white; padding: 15px 30px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: 600; }
        button:disabled { background: #444; cursor: not-allowed; }
        #result { display: none; margin-top: 20px; padding: 20px; background: #1a2a3a; border-radius: 8px; text-align: left; border: 1px solid #2a4a6a; }
        #result h3 { color: #60a5fa; margin-bottom: 10px; }
        .back-link { display: block; margin-top: 20px; color: #60a5fa; text-decoration: none; }
        .loader { display: none; margin-top: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Symptom Checker</h1>
        <p>Describe your symptoms below, and our built-in AI will suggest which type of doctor you should see.</p>
        <textarea id="symptomsInput" placeholder="e.g., I have a headache, fever, and sore throat..."></textarea>
        <button id="checkBtn" onclick="checkSymptoms()">Check Symptoms</button>
        <div id="loader" class="loader">🔄 AI is analyzing your symptoms...</div>
        <div id="result"><h3>🩺 AI Recommendation</h3><p id="resultText">Loading...</p></div>
        <a href="https://ziobunctelemedicineng.vercel.app" class="back-link">← Back to Home</a>
    </div>
    <script>
        async function checkSymptoms() {
            const input = document.getElementById('symptomsInput').value.toLowerCase();
            if (!input.trim()) { alert("Please describe your symptoms first."); return; }
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            setTimeout(() => {
                let specialty = "General Medicine";
                let reason = "Your symptoms suggest a general check-up.";
                if (input.includes("headache") && input.includes("fever")) { specialty = "General Medicine"; reason = "Headache with fever often indicates an infection. See a general doctor first."; }
                else if (input.includes("skin") || input.includes("rash") || input.includes("itch")) { specialty = "Dermatology"; reason = "Skin conditions are best treated by a dermatologist."; }
                else if (input.includes("chest") || input.includes("heart") || input.includes("breath")) { specialty = "Cardiology"; reason = "Chest or breathing issues should be checked by a heart specialist."; }
                else if (input.includes("child") || input.includes("baby") || input.includes("kid")) { specialty = "Pediatrics"; reason = "Children's health is best handled by a pediatrician."; }
                else if (input.includes("headache") || input.includes("dizzy")) { specialty = "Neurology"; reason = "Headaches and dizziness may be related to the nervous system."; }
                document.getElementById('resultText').innerHTML = `<strong>Specialty:</strong> ${specialty}<br><br><strong>Reason:</strong> ${reason}`;
                document.getElementById('result').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('checkBtn').disabled = false;
            }, 1500);
        }
    </script>
</body>
</html>
