<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Ziobunc</title>
    <style>
        :root { --bg: #f4f7fc; --card: white; --text: #333; }
        body.dark-mode { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        * { transition: 0.3s; margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: var(--card); padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 20px; color: #1a2b4c; }
        body.dark-mode h1 { color: #fff; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .back { text-align: center; margin-top: 15px; }
        .back a { color: #007bff; text-decoration: none; }
        .theme-btn { position: absolute; top: 20px; right: 20px; padding: 5px 15px; border-radius: 20px; border: 1px solid #ccc; cursor: pointer; }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    <div class="login-box">
        <h1>Doctor Login</h1>
        <form onsubmit="alert('Backend login coming soon!'); return false;">
            <input type="email" placeholder="Doctor Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="back"><a href="index.html">← Back to Home</a></div>
    </div>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.theme-btn');
            btn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
