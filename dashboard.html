<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a2b4c; margin-bottom: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .back-link { display: block; text-align: center; margin-top: 30px; }
        .back-link a { color: #007bff; text-decoration: none; }
        .loading { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🩺 Doctor Dashboard</h1>
        <p style="text-align: center; color: #666;">Welcome, Dr. Adewale. Here are your upcoming appointments.</p>
        
        <div id="loading" class="loading">⏳ Loading appointments from the cloud...</div>
        
        <table id="appointmentsTable" style="display:none;">
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Doctor</th>
                    <th>Date & Time</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody id="appointmentsBody"></tbody>
        </table>
        
        <div class="back-link"><a href="https://ziobunctelemedicineng.vercel.app">← Back to Home</a></div>
    </div>

    <script>
        async function loadBookings() {
            try {
                const response = await fetch('https://ziobunc-backend.onrender.com/api/bookings');
                
                if (!response.ok) {
                    throw new Error('Server responded with error');
                }
                
                const bookings = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('appointmentsTable').style.display = 'table';
                
                const tbody = document.getElementById('appointmentsBody');
                tbody.innerHTML = '';
                
                if (bookings.length === 0) {
                    const row = tbody.insertRow();
                    row.innerHTML = '<td colspan="6" style="text-align:center; color:#888;">No appointments yet. Check back later.</td>';
                } else {
                    bookings.forEach(b => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${b.fullName}</td>
                            <td>${b.email}</td>
                            <td>${b.phone}</td>
                            <td>${b.doctor}</td>
                            <td>${new Date(b.datetime).toLocaleString()}</td>
                            <td>${b.type}</td>
                        `;
                    });
                }
            } catch (err) {
                console.error('Error loading bookings:', err);
                document.getElementById('loading').innerHTML = '⚠️ Still connecting to the cloud database. This might take a moment...';
                // Try again in 10 seconds
                setTimeout(loadBookings, 10000);
            }
        }
        
        // Start loading
        loadBookings();
    </script>
</body>
</html>
