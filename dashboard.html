<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a2b4c; margin-bottom: 20px; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .add-btn { background: #28a745; color: white; padding: 8px 16px; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .add-btn:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .avail-btn { background: #28a745; color: white; padding: 4px 12px; border: none; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .avail-btn.busy { background: #dc3545; }
        .rx-btn { background: #ffc107; color: #1a2b4c; padding: 4px 12px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; }
        .record-btn { background: #17a2b8; color: white; padding: 4px 12px; border: none; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .room-btn { background: #6f42c1; color: white; padding: 4px 12px; border: none; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; max-width: 90%; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .modal-content button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .modal-content .close { float: right; font-size: 24px; cursor: pointer; }
        .back-link { display: block; text-align: center; margin-top: 30px; }
        .back-link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🩺 Admin Dashboard</h1>
        <div class="top-bar">
            <h3>👨‍⚕️ Manage Professionals</h3>
            <button class="add-btn" onclick="openModal()">➕ Add New Professional</button>
        </div>
        <table id="doctorTable">
            <thead><tr><th>Name</th><th>Specialty</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="doctorBody"></tbody>
        </table>

        <h3 style="margin-top: 30px;">📋 Patient Appointments</h3>
        <table id="appointmentsTable">
            <thead><tr><th>Patient</th><th>Email</th><th>Phone</th><th>Doctor</th><th>Date</th><th>Type</th><th>Actions</th></tr></thead>
            <tbody id="appointmentsBody"></tbody>
        </table>
        <div class="back-link"><a href="https://ziobunctelemedicineng.vercel.app">← Back to Home</a></div>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Add New Professional</h3>
            <input type="text" id="newName" placeholder="Full Name">
            <input type="text" id="newSpecialty" placeholder="Specialty (e.g. General Medicine)">
            <button onclick="addProfessional()">Add Professional</button>
        </div>
    </div>

    <script>
        async function loadDoctors() {
            const res = await fetch('https://ziobunc-backend.onrender.com/api/doctors');
            const doctors = await res.json();
            const tbody = document.getElementById('doctorBody');
            tbody.innerHTML = '';
            doctors.forEach(d => {
                const row = tbody.insertRow();
                const cls = d.available ? '' : 'busy';
                const txt = d.available ? 'Set Busy' : 'Set Available';
                row.innerHTML = `
                    <td>${d.name}</td><td>${d.specialty}</td>
                    <td><span style="color:${d.available?'#28a745':'#dc3545'};font-weight:bold;">${d.available?'🟢 Available':'🔴 Busy'}</span></td>
                    <td><button class="avail-btn ${cls}" onclick="toggleAvailability('${d._id}')">${txt}</button></td>
                `;
            });
        }

        async function toggleAvailability(id) {
            await fetch('https://ziobunc-backend.onrender.com/api/toggle-availability', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({doctorId: id})
            });
            loadDoctors();
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        async function addProfessional() {
            const name = document.getElementById('newName').value.trim();
            const specialty = document.getElementById('newSpecialty').value.trim();
            if (!name || !specialty) return alert('Please fill both fields.');
            const res = await fetch('https://ziobunc-backend.onrender.com/api/add-doctor', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({name, specialty})
            });
            if (res.ok) { closeModal(); loadDoctors(); } else alert('Error adding professional.');
        }

        loadDoctors();
    </script>
</body>
</html>
