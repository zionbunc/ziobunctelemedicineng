<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a2b4c; margin-bottom: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .back-link { display: block; text-align: center; margin-top: 30px; }
        .back-link a { color: #007bff; text-decoration: none; }
        .rx-btn { background: #ffc107; color: #1a2b4c; padding: 5px 12px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .rx-btn:hover { background: #e0a800; }
        .avail-btn { background: #28a745; color: white; padding: 5px 12px; border-radius: 20px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; }
        .avail-btn.busy { background: #dc3545; }
        .record-btn { background: #17a2b8; color: white; padding: 5px 12px; border-radius: 20px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; }
        .record-btn:hover { background: #138496; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 12px; width: 80%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .close-btn { float: right; font-size: 24px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #000; }
        .record-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .record-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🩺 Doctor Dashboard</h1>
        <p style="text-align: center; color: #666;">Manage your doctors and appointments below.</p>

        <h3 style="margin-top: 20px;">👨‍⚕️ Manage Doctors</h3>
        <table id="doctorTable">
            <thead>
                <tr>
                    <th>Doctor Name</th>
                    <th>Specialty</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="doctorBody">
                <!-- Doctors loaded here -->
            </tbody>
        </table>

        <h3 style="margin-top: 30px;">📋 Patient Appointments</h3>
        <table id="appointmentsTable">
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Doctor</th>
                    <th>Date & Time</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="appointmentsBody">
                <!-- Appointments loaded here -->
            </tbody>
        </table>
        
        <div class="back-link"><a href="https://ziobunctelemedicineng.vercel.app">← Back to Home</a></div>
    </div>

    <!-- EHR Modal -->
    <div id="ehrModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEHR()">&times;</span>
            <h2 style="color: #1a2b4c;">📂 Patient Records</h2>
            <div id="ehrContent">
                <p style="color: #888;">Loading records...</p>
            </div>
        </div>
    </div>

    <script>
        // Load Doctors
        async function loadDoctors() {
            try {
                const res = await fetch('https://ziobunc-backend.onrender.com/api/doctors');
                const doctors = await res.json();
                const tbody = document.getElementById('doctorBody');
                tbody.innerHTML = '';
                doctors.forEach(d => {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${d.name}</td>
                        <td>${d.specialty}</td>
                        <td><span style="color: ${d.available ? '#28a745' : '#dc3545'}; font-weight: bold;">${d.available ? '🟢 Available' : '🔴 Busy'}</span></td>
                        <td><button class="avail-btn ${d.available ? '' : 'busy'}" onclick="toggleAvailability('${d._id}')">${d.available ? 'Set Busy' : 'Set Available'}</button></td>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Toggle Availability
        async function toggleAvailability(id) {
            try {
                const res = await fetch('https://ziobunc-backend.onrender.com/api/toggle-availability', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doctorId: id })
                });
                if (res.ok) loadDoctors();
            } catch (err) {
                alert('Error toggling status');
            }
        }

        // Load Appointments with Records Button
        async function loadBookings() {
            try {
                const response = await fetch('https://ziobunc-backend.onrender.com/api/bookings');
                const bookings = await response.json();
                const tbody = document.getElementById('appointmentsBody');
                tbody.innerHTML = '';
                bookings.forEach(b => {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${b.fullName}</td>
                        <td>${b.email}</td>
                        <td>${b.phone}</td>
                        <td>${b.doctor}</td>
                        <td>${new Date(b.datetime).toLocaleString()}</td>
                        <td>${b.type}</td>
                        <td>
                            <a class="rx-btn" onclick="createPrescription('${b.fullName}', '${b.email}')">📄 Prescribe</a>
                            <button class="record-btn" onclick="viewRecords('${b.email}')">📂 Records</button>
                        </td>
                    `;
                });
            } catch (err) {
                console.error('Error loading bookings:', err);
                document.getElementById('appointmentsBody').innerHTML = 
                    '<tr><td colspan="7" style="text-align:center; color:red;">Failed to load appointments.</td></tr>';
            }
        }

        // View Patient Records (Secure)
        async function viewRecords(email) {
            document.getElementById('ehrModal').style.display = 'block';
            document.getElementById('ehrContent').innerHTML = '<p style="color: #888;">Loading records for ' + email + '...</p>';
            
            try {
                const res = await fetch('https://ziobunc-backend.onrender.com/api/patient-records?email=' + encodeURIComponent(email));
                const records = await res.json();
                
                if (records.length === 0) {
                    document.getElementById('ehrContent').innerHTML = '<p style="color: #888;">No past records found for this patient.</p>';
                } else {
                    let html = '';
                    records.forEach(r => {
                        const date = new Date(r.createdAt).toLocaleDateString();
                        html += `
                            <div class="record-item">
                                <strong>${date}</strong><br>
                                <span style="color: #007bff;">${r.medication}</span>
                            </div>
                        `;
                    });
                    document.getElementById('ehrContent').innerHTML = html;
                }
            } catch (err) {
                document.getElementById('ehrContent').innerHTML = '<p style="color: red;">Error loading records.</p>';
            }
        }

        function closeEHR() {
            document.getElementById('ehrModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('ehrModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Create Prescription
        async function createPrescription(name, email) {
            const med = prompt("Enter prescribed medication and dosage:");
            if (med) {
                try {
                    const res = await fetch('https://ziobunc-backend.onrender.com/api/prescription', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ patientName: name, patientEmail: email, medication: med })
                    });
                    if (!res.ok) throw new Error('Server error');
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `prescription_${name.replace(/\s/g, '_')}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    alert('✅ Prescription downloaded!');
                    loadBookings(); // Refresh to show record
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }
        }

        // Load everything on page load
        loadDoctors();
        loadBookings();
    </script>
</body>
</html>
