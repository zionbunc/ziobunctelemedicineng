<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Consultation - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #ffffff; margin-bottom: 20px; text-align: center; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #e0e0e0; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #444; border-radius: 6px; font-size: 16px; background: #2a2a2a; color: #e0e0e0; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
        .hidden { display: none; }
        .thank-you { text-align: center; padding: 20px 0; }
        .thank-you h2 { color: #28a745; margin-bottom: 10px; }
        .admin-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .admin-link a { color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="booking-form">
            <h1>Book a Consultation</h1>
            <form id="appointmentForm" action="https://ziobunc-backend.onrender.com/api/book" method="POST">
                <label>Full Name</label>
                <input type="text" name="fullName" id="fullName" placeholder="Enter your full name" required>
                <label>Email Address</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" required>
                <label>Phone Number</label>
                <input type="tel" name="phone" id="phone" placeholder="080xxxxxxxx" required>
                
                <label>Select Professional</label>
                <select name="doctor" id="doctorSelect" required>
                    <option value="">-- Please select a professional --</option>
                </select>

                <label>Date & Time</label>
                <input type="datetime-local" name="datetime" id="datetime" required>
                <label>Consultation Type</label>
                <select name="type" id="type">
                    <option>Video Call</option>
                    <option>Audio Call</option>
                    <option>Text Chat</option>
                </select>
                <button type="submit" id="submit-btn">Book Appointment</button>
            </form>
            <a href="https://ziobunctelemedicineng.vercel.app" class="back-link">← Back to Home</a>
        </div>
        <div id="thank-you" class="hidden thank-you">
            <h2>✅ Appointment Booked!</h2>
            <p>Your consultation has been scheduled. You will receive a confirmation shortly.</p>
            <a href="https://ziobunctelemedicineng.vercel.app" class="back-link" style="margin-top: 30px;">← Go back to Home</a>
        </div>
    </div>
    <script>
        // Load professionals dynamically from the database
        async function loadProfessionals() {
            try {
                const res = await fetch('https://ziobunc-backend.onrender.com/api/doctors');
                const doctors = await res.json();
                const select = document.getElementById('doctorSelect');
                select.innerHTML = '<option value="">-- Please select a professional --</option>';
                doctors.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.name;
                    opt.textContent = d.name + ' (' + d.specialty + ')';
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Failed to load professionals:', err);
            }
        }

        document.getElementById('appointmentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('booking-form').classList.add('hidden');
            document.getElementById('thank-you').classList.remove('hidden');
        });

        loadProfessionals();
    </script>
</body>
</html>
