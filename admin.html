<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a2b4c; text-align: center; margin-bottom: 30px; }
        .appointment-card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .appointment-card h3 { color: #007bff; margin-bottom: 5px; }
        .appointment-card p { color: #666; font-size: 14px; margin: 3px 0; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #007bff; text-decoration: none; }
        .empty-msg { text-align: center; color: #888; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Dashboard</h1>
        <div id="appointments-list">
            <p class="empty-msg">No appointments booked yet. Check back later.</p>
        </div>
        <a href="index.html" class="back-link">← Back to Homepage</a>
    </div>

    <script>

</html>
