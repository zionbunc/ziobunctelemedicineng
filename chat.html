<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Chat - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1a2b4c; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 30px; }
        .chat-box { background: #f8f9fa; border: 1px solid #eee; border-radius: 8px; padding: 20px; height: 200px; overflow-y: auto; text-align: left; margin-bottom: 15px; }
        .chat-msg { margin-bottom: 10px; }
        .chat-msg strong { color: #007bff; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .back-link { display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Text Chat</h1>
        <p>Chat with your doctor in real-time.</p>
        
        <div class="chat-box" id="chatBox">
            <div class="chat-msg"><strong>System:</strong> You are now connected. Please wait for the doctor to respond.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
        
        <a href="https://ziobunctelemedicineng.vercel.app" class="back-link">← Back to Home</a>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (msg) {
                const chatBox = document.getElementById('chatBox');
                const newMsg = document.createElement('div');
                newMsg.className = 'chat-msg';
                newMsg.innerHTML = `<strong>You:</strong> ${msg}`;
                chatBox.appendChild(newMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
                input.value = '';
            }
        }

        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
