<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Consultation - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; color: #4facfe; }
        .header p { color: #bbb; font-size: 14px; }

        /* The Jitsi Video Container */
        #jitsi-container {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background: #2d2d2d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .controls { margin-top: 20px; display: flex; gap: 15px; }
        .control-btn { padding: 10px 25px; border: none; border-radius: 30px; background: #28a745; color: white; cursor: pointer; font-size: 14px; }
        .control-btn.end { background: #dc3545; }
        .back-link { margin-top: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🩺 Live Video Consultation</h1>
        <p>Please wait for your doctor to join the room.</p>
    </div>

    <!-- This is where the video will appear -->
    <div id="jitsi-container"></div>

    <div class="controls">
        <button class="control-btn">🎤 Mic On</button>
        <button class="control-btn">📷 Camera On</button>
        <button class="control-btn end">📞 End Call</button>
    </div>

    <a href="thank-you.html" class="back-link">← Back to Appointment</a>

    <!-- The Jitsi Library (Runs the video) -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        // Generate a unique room name based on the time
        const roomName = "ZiobuncRoom-" + Math.floor(Date.now() / 1000);

        const domain = "meet.jit.si";
        const options = {
            roomName: roomName,
            parentNode: document.querySelector('#jitsi-container'),
            width: '100%',
            height: '100%',
            configOverwrite: {
                prejoinPageEnabled: false
            },
            interfaceConfigOverwrite: {
                TOOLBAR_ALWAYS_VISIBLE: false,
                DEFAULT_LOGO_URL: 'https://ziobunctelemedicineng.vercel.app/logo.png',
                DISABLE_JOIN_LEAVE_NOTIFICATIONS: true
            }
        };

        // Start the video call
        const api = new JitsiMeetExternalAPI(domain, options);
    </script>
</body>
</html>
