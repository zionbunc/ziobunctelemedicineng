<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Consultation - Ziobunc Telemedicine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; color: #60a5fa; }
        .header p { color: #94a3b8; font-size: 14px; }
        #jitsi-container { width: 100%; max-width: 1000px; height: 600px; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 1px solid #333; }
        .controls { margin-top: 20px; display: flex; gap: 15px; }
        .control-btn { padding: 10px 25px; border: none; border-radius: 30px; background: #28a745; color: white; cursor: pointer; font-size: 14px; }
        .control-btn.end { background: #dc3545; }
        .back-link { margin-top: 20px; color: #60a5fa; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🩺 Live Video Consultation</h1>
        <p>Please wait for your doctor to join the room.</p>
    </div>
    <div id="jitsi-container"></div>
    <div class="controls">
        <button class="control-btn">🎤 Mic On</button>
        <button class="control-btn">📷 Camera On</button>
        <button class="control-btn end">📞 End Call</button>
    </div>
    <a href="thank-you.html" class="back-link">← Back to Appointment</a>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        const roomName = "ZiobuncRoom-" + Math.floor(Date.now() / 1000);
        const domain = "meet.jit.si";
        const options = {
            roomName: roomName,
            parentNode: document.querySelector('#jitsi-container'),
            width: '100%',
            height: '100%',
            configOverwrite: { prejoinPageEnabled: false },
            interfaceConfigOverwrite: { TOOLBAR_ALWAYS_VISIBLE: false, DEFAULT_LOGO_URL: 'https://ziobunctelemedicineng.vercel.app/logo.png', DISABLE_JOIN_LEAVE_NOTIFICATIONS: true }
        };
        const api = new JitsiMeetExternalAPI(domain, options);
    </script>
</body>
</html>
